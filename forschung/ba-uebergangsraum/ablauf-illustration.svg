<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Vier Schritte für ein schwieriges Anliegen</title>
<desc id="desc">Vom vollen Empfang über ein ruhiges Gespräch und eine fachliche Entscheidung bis zu einem verbesserten Ablauf.</desc>
<defs><style>.card{fill:#f8fbf9;stroke:#b8d7d0;stroke-width:2}.head{font:700 21px system-ui,sans-serif;fill:#123447}.small{font:600 14px system-ui,sans-serif;fill:#355466}.line{stroke:#173d4d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}.skin{fill:#eac29d;stroke:#173d4d;stroke-width:4}.mint{fill:#63cfb5;stroke:#173d4d;stroke-width:4}.blue{fill:#80b5dc;stroke:#173d4d;stroke-width:4}.gold{fill:#f4c873;stroke:#173d4d;stroke-width:4}</style></defs>
<rect width="1200" height="410" rx="24" fill="#e7f1ee"/>
<g transform="translate(18 22)"><rect class="card" width="276" height="365" rx="18"/><text class="head" x="22" y="40">1. Ankommen</text><text class="small" x="22" y="64">Viele Menschen. Ein Anliegen drängt.</text><rect x="22" y="97" width="230" height="153" rx="13" fill="#d9e9e7"/><path class="line" d="M38 218h198M38 191h198"/><rect x="155" y="129" width="66" height="62" rx="6" fill="#fff" stroke="#173d4d" stroke-width="4"/><path d="M168 145h40m-40 12h34m-34 12h28" stroke="#80b5dc" stroke-width="4" stroke-linecap="round"/><circle class="skin" cx="81" cy="140" r="19"/><path class="blue" d="M52 197q0-36 29-36t29 36z"/><circle class="skin" cx="133" cy="144" r="17"/><path class="gold" d="M107 193q0-34 26-34t26 34z"/><path d="M26 286h224" stroke="#b8d7d0" stroke-width="2"/><text class="small" x="22" y="316">Der Empfang muss</text><text class="small" x="22" y="338">weiterarbeiten.</text></g>
<g transform="translate(314 22)"><rect class="card" width="276" height="365" rx="18"/><text class="head" x="22" y="40">2. Raum geben</text><text class="small" x="22" y="64">Ein Mensch hört in Ruhe zu.</text><rect x="22" y="97" width="230" height="153" rx="13" fill="#d9e9e7"/><circle class="skin" cx="88" cy="140" r="19"/><path class="blue" d="M58 210q0-48 30-48t30 48z"/><circle class="skin" cx="187" cy="140" r="19"/><path class="mint" d="M157 210q0-48 30-48t30 48z"/><path class="line" d="M112 184q20-16 47-3"/><path d="M117 113h40l11 12-10 8h-41z" fill="#fff" stroke="#173d4d" stroke-width="3"/><path d="M26 286h224" stroke="#b8d7d0" stroke-width="2"/><text class="small" x="22" y="316">Gefühl und Sachfrage</text><text class="small" x="22" y="338">werden sortiert.</text></g>
<g transform="translate(610 22)"><rect class="card" width="276" height="365" rx="18"/><text class="head" x="22" y="40">3. Fachlich klären</text><text class="small" x="22" y="64">Die Zuständigkeit bleibt klar.</text><rect x="22" y="97" width="230" height="153" rx="13" fill="#d9e9e7"/><rect x="41" y="177" width="192" height="17" rx="7" fill="#173d4d"/><circle class="skin" cx="106" cy="133" r="19"/><path class="gold" d="M75 177q0-28 31-28t31 28z"/><path d="M157 125h55v45h-55z" fill="#fff" stroke="#173d4d" stroke-width="4"/><path d="m168 147 10 10 22-23" fill="none" stroke="#1b9c76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 286h224" stroke="#b8d7d0" stroke-width="2"/><text class="small" x="22" y="316">Die zuständige Stelle</text><text class="small" x="22" y="338">trifft die Entscheidung.</text></g>
<g transform="translate(906 22)"><rect class="card" width="276" height="365" rx="18"/><text class="head" x="22" y="40">4. Besser werden</text><text class="small" x="22" y="64">Der nächste Weg wird einfacher.</text><rect x="22" y="97" width="230" height="153" rx="13" fill="#d9e9e7"/><rect x="49" y="127" width="63" height="74" rx="7" fill="#fff" stroke="#173d4d" stroke-width="4"/><path d="M62 145h37m-37 13h34m-34 13h29" stroke="#80b5dc" stroke-width="4" stroke-linecap="round"/><path d="M113 164h51" stroke="#173d4d" stroke-width="5" stroke-linecap="round"/><path d="m155 151 17 13-17 13" class="line"/><rect x="177" y="128" width="47" height="73" rx="7" fill="#fff" stroke="#173d4d" stroke-width="4"/><path d="m187 160 10 10 17-23" fill="none" stroke="#1b9c76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M26 286h224" stroke="#b8d7d0" stroke-width="2"/><text class="small" x="22" y="316">Das Team verbessert</text><text class="small" x="22" y="338">Brief oder Übergabe.</text></g>
</svg>

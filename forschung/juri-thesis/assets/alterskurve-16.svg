<svg xmlns="http://www.w3.org/2000/svg" width="960" height="385" viewBox="0 0 960 385" role="img" aria-labelledby="title desc">
<title id="title">16-Punkte-Alterskurve als Diskussionsmodell</title>
<desc id="desc">Das relative Gewicht sinkt linear von 2 bei 18 Jahren auf 1 bei 65 Jahren. Die 16 markierten Alterswerte sind Stützpunkte, keine Ausschlüsse. Jedes Alter von 18 an bleibt im Modell enthalten; ab 65 gilt das positive Gewicht 1. Keine echte Bewerbungsentscheidung.</desc>
<rect width="960" height="385" rx="24" fill="#e7f1eb"/>
<path d="M76 110H876M76 211H876M76 312H876" stroke="#a5beb5" stroke-dasharray="5 7"/>
<path d="M76 100V312H888" fill="none" stroke="#27495a" stroke-width="2"/>
<text x="48" y="115" text-anchor="end">2,0</text><text x="48" y="216" text-anchor="end">1,5</text><text x="48" y="317" text-anchor="end">1,0</text>
<text x="76" y="62" fill="#14314b" font-size="20" font-weight="700">Jünger stärker gewichtet - alle Erwachsenen bleiben im Bild</text>
<polyline points="76.0,110.0 127.1,122.9 178.1,135.8 229.2,148.7 297.3,165.9 348.3,178.8 399.4,191.7 450.5,204.6 501.5,217.4 552.6,230.3 603.7,243.2 654.7,256.1 722.8,273.3 773.9,286.2 824.9,299.1 876.0,312.0" fill="none" stroke="#146857" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

le cx="876.0" cy="312.0" r="8" fill="#f5c965" stroke="#14314b" stroke-width="3"/><title>Alter 65: Gewicht 1.000</title></g><g><line x1="76.0" x2="76.0" y1="312" y2="320" stroke="#517082"/><text x="76.0" y="345" text-anchor="middle">18</text></g><g><line x1="280.3" x2="280.3" y1="312" y2="320" stroke="#517082"/><text x="280.3" y="345" text-anchor="middle">30</text></g><g><line x1="484.5" x2="484.5" y1="312" y2="320" stroke="#517082"/><text x="484.5" y="345" text-anchor="middle">42</text></g><g><line x1="620.7" x2="620.7" y1="312" y2="320" stroke="#517082"/><text x="620.7" y="345" text-anchor="middle">50</text></g><g><line x1="876.0" x2="876.0" y1="312" y2="320" stroke="#517082"/><text x="876.0" y="345" text-anchor="middle">65</text></g>

name: Check Scarlet pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build public site and validate links
        run: node tools/build_site.mjs
      - name: Test site
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Test Python tools
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Require a commit-bound public build
        run: node tools/verify_build_info.mjs

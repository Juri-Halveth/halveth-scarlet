name: Check Scarlet pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build public site and validate links
        run: node tools/build_site.mjs
      - name: Test site
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Test Python tools
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Require a commit-bound public build
        run: node tools/verify_build_info.mjs
      - name: Install pinned browser-test dependencies
        run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for the browser regression
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Test rendered scene and hidden-scene counterexample
        run: npm test --prefix tests/browser
      - name: Retain browser observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singularity-browser-observations
          path: tests/browser/artifacts/
          if-no-files-found: ignore
          retention-days: 3
